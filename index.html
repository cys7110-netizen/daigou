<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>韓吉計算機</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" type="image/png" href="st/icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2a1a1e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="韓吉計算機">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>(function(){var l=document.createElement("link");l.rel="stylesheet";l.href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap";document.head.appendChild(l)})()</script>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
/* Layout: one-screen sticker calculator; header + input card + result card, all settings in a bottom sheet */
:root{
  --bg:#fff6f4; --dots:#f6dcdc;
  --card:#ffffff; --ink:#4a2228; --muted:#8c5c63;
  --potato:#c94f6b; --mint:#bfe6cf; --sun:#ffc93c; --sky:#5aa9e6; --field:#fff0ee; --blush:#ffd9df;
  --display:"Fredoka","M PLUS Rounded 1c","Noto Sans TC","PingFang TC",system-ui,sans-serif;
  --body:"M PLUS Rounded 1c","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#2a1a1e; --dots:#3a252b; --card:#3a2329; --ink:#ffe9ec; --muted:#d7a9b1;
  --potato:#d9607b; --mint:#3d6b52; --sun:#ffd25e; --sky:#7cbcf0; --field:#4a2d34; --blush:#5a3640; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#2a1a1e; --dots:#3a252b; --card:#3a2329; --ink:#ffe9ec; --muted:#d7a9b1;
  --potato:#d9607b; --mint:#3d6b52; --sun:#ffd25e; --sky:#7cbcf0; --field:#4a2d34; --blush:#5a3640; color-scheme:dark}

*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);background-image:radial-gradient(var(--dots) 2px,transparent 2.5px);background-size:22px 22px;color:var(--ink);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 20px}
body{min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;justify-content:center}
.wrap{width:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

header{display:flex;align-items:center;gap:8px}
.mascot{width:76px;height:76px;object-fit:contain;flex:none;animation:bob 2.6s ease-in-out infinite;transition:transform .2s}
.mascot.swap{transform:scale(.85)}
@keyframes bob{50%{transform:translateY(-3px) rotate(-2deg)}}
.bubble{position:relative;background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:7px 12px;box-shadow:3px 3px 0 var(--ink);flex:1;min-width:0;margin-left:6px}
.bubble::before,.bubble::after{content:"";position:absolute;top:50%;width:0;height:0;border-style:solid;border-color:transparent}
.bubble::before{left:-17px;margin-top:-10px;border-width:10px 14px 10px 0;border-right-color:var(--ink)}
.bubble::after{left:-11px;margin-top:-7px;border-width:7px 10px 7px 0;border-right-color:var(--card)}
.bubble h1{margin:0;font-family:var(--display);font-weight:700;font-size:1.2rem;letter-spacing:.02em}
.bubble p{margin:1px 0 0;color:var(--muted);font-size:.8rem;line-height:1.35}
.gear{flex:none;width:48px;height:48px;border-radius:16px;border:3px solid var(--ink);background:var(--mint);box-shadow:3px 3px 0 var(--ink);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.gear:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.gear svg{width:24px;height:24px}

.card{background:var(--card);border:3px solid var(--ink);border-radius:22px;box-shadow:4px 4px 0 var(--ink);padding:14px;display:flex;flex-direction:column;gap:10px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--field);border:3px solid var(--ink);border-radius:999px;padding:3px}
.tabs button{font:700 .9rem var(--body);white-space:nowrap;min-width:0;color:var(--ink);background:transparent;border:0;border-radius:999px;padding:7px 6px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.tabs button[aria-pressed="true"]{background:var(--potato);color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.tabs .flag{font-family:var(--display);font-size:.75rem;background:var(--card);color:var(--ink);border-radius:999px;padding:0 6px;border:2px solid var(--ink)}

label,.lab{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.82rem;min-width:0}
label small,.lab small{font-weight:500;color:var(--muted);font-size:.74rem}
.field{display:flex;align-items:center;background:var(--field);border:3px solid var(--ink);border-radius:14px;padding:0 10px;min-width:0}
.field:focus-within{box-shadow:0 0 0 3px var(--sun)}
.field span{font-family:var(--display);font-weight:600;color:var(--muted);white-space:nowrap}
.field input{flex:1;min-width:0;width:100%;border:0;background:transparent;color:var(--ink);font:600 1.05rem var(--display);padding:9px 6px;outline:none;font-variant-numeric:tabular-nums}
.price-row{display:grid;grid-template-columns:1fr 112px;gap:8px;align-items:end}
.big .field input{font-size:1.7rem;padding:5px 6px}
.big .field span{font-size:1.3rem}
.stepper{display:flex;align-items:center;background:var(--field);border:3px solid var(--ink);border-radius:14px;height:100%;min-height:52px}
.stepper button{width:32px;height:100%;border:0;background:transparent;font:700 1.3rem var(--display);color:var(--ink);cursor:pointer}
.stepper input{flex:1;min-width:0;width:100%;border:0;background:transparent;text-align:center;font:600 1.2rem var(--display);color:var(--ink);outline:none;-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button,.stepper input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%;border:0;background:none;padding:0;cursor:pointer;text-align:left}
.chip{font:700 .76rem var(--body);background:var(--blush);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:4px 9px;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:center}

.result{position:relative;background:var(--potato);color:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:4px 4px 0 var(--ink);padding:14px;overflow:hidden}
.result-st{position:absolute;right:4px;top:2px;width:76px;height:76px;object-fit:contain;transform:rotate(8deg)}
.result .lbl{font-weight:800;font-size:.8rem;opacity:.92;letter-spacing:.05em}
.result .price{font-family:var(--display);font-weight:700;font-size:clamp(2.2rem,10vw,2.8rem);line-height:1.1;font-variant-numeric:tabular-nums;margin:0 0 8px;padding-right:72px;transition:transform .15s;transform-origin:left}
.result .price.pop{transform:scale(1.05)}
.result .price small{font-size:.45em;margin-right:4px;opacity:.9}
.break{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.break div{background:rgba(0,0,0,.14);border-radius:12px;padding:6px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:.78rem;min-width:0}
.break b{font-family:var(--display);font-weight:600;font-size:.95rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.break .profit b{color:#ffe3e8}
.copy{margin-top:10px;width:100%;font:800 1rem var(--body);color:#4a2228;background:#ffd9df;border:3px solid var(--ink);border-radius:999px;padding:10px;cursor:pointer;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.copy:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.quote{margin-top:8px;font-size:.76rem;opacity:.9;white-space:pre-wrap;word-break:break-word;user-select:all;text-align:center}

/* settings sheet */
.scrim{position:fixed;inset:0;background:rgba(40,15,20,.45);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-top:3px solid var(--ink);border-radius:26px 26px 0 0;
  padding:14px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  max-height:88vh;overflow-y:auto;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.9,.3,1.1)}
.sheet.open{transform:none}
.sheet-in{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sheet-head h2{margin:0;font-family:var(--display);font-size:1.15rem;display:flex;align-items:center;gap:6px}
.sheet-head h2 img{width:44px;height:44px;object-fit:contain}
.done{font:800 .95rem var(--body);background:var(--potato);color:#fff;border:3px solid var(--ink);border-radius:999px;padding:7px 18px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.grp{font-weight:800;font-size:.78rem;color:var(--muted);letter-spacing:.06em;margin:4px 0 -4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.lab .check{flex-direction:row}
.check{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.88rem;cursor:pointer;margin-top:4px}
.check input{appearance:none;-webkit-appearance:none;width:24px;height:24px;margin:0;border:2.5px solid var(--ink);border-radius:8px;background:var(--field);display:grid;place-items:center;cursor:pointer;flex:none}
.check input:checked{background:var(--mint)}
.check input:checked::after{content:"";width:6px;height:11px;border:solid var(--ink);border-width:0 3px 3px 0;transform:translate(0,-1px) rotate(45deg)}
.check input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.seg button{font:700 .8rem var(--body);color:var(--ink);background:var(--field);border:2.5px solid var(--ink);border-radius:999px;padding:5px 2px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--mint)}
.hint{font-size:.74rem;color:var(--muted);margin:0;line-height:1.5}
.hint a{color:var(--potato);font-weight:700}

button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140px);background:var(--ink);color:var(--card);font-weight:700;padding:10px 18px;border-radius:999px;transition:transform .25s;z-index:30}
.toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <img class="mascot" id="mascot" alt="" src="st/wave.webp" fetchpriority="high">
    <div class="bubble">
      <h1>韓吉計算機</h1>
      <p id="say">輸入價格，馬上算台幣報價！</p>
    </div>
    <button class="gear" id="open-set" aria-label="設定">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <section class="card" aria-label="輸入">
    <div class="tabs" role="group" aria-label="選擇幣別">
      <button id="tab-krw" aria-pressed="false"><span class="flag">KR</span>韓幣 ₩</button>
      <button id="tab-jpy" aria-pressed="true"><span class="flag">JP</span>日幣 ¥</button>
      <button id="tab-eur" aria-pressed="false"><span class="flag">EU</span>歐元 €</button>
    </div>
    <div class="price-row">
      <label for="price" class="big">商品價格
        <div class="field"><span id="sym">¥</span><input id="price" type="text" inputmode="decimal" value="3,980" autocomplete="off"></div>
      </label>
      <label for="qty">數量
        <div class="stepper"><button id="minus" aria-label="減少">−</button><input id="qty" type="number" inputmode="numeric" min="1" value="1"><button id="plus" aria-label="增加">+</button></div>
      </label>
    </div>
    <button class="summary" id="summary" aria-label="打開設定">
      <span class="chip" id="c-rate">匯率 —</span>
      <span class="chip" id="c-quote">給客人 —</span>
      <span class="chip" id="c-fee">代購費 —</span>
      <span class="chip" id="c-ship">運費 —</span>
    </button>
  </section>

  <section class="result" aria-live="polite">
    <img class="result-st" id="res-st" alt="" src="st/heart.webp">
    <div class="lbl">給客人的報價</div>
    <div class="price" id="total"><small>NT$</small>0</div>
    <div class="break">
      <div><span>原價換算</span><b id="b-raw">—</b></div>
      <div><span>代購費</span><b id="b-fee">—</b></div>
      <div><span>運費＋手續費</span><b id="b-ship">—</b></div>
      <div><span>實際成本</span><b id="b-cost">—</b></div>
      <div class="profit" style="grid-column:1/-1"><span>預估利潤</span><b id="b-profit">—</b></div>
    </div>
    <button class="copy" id="copy">複製報價給客人</button>
    <div class="quote" id="quote"></div>
  </section>
</div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="set-title" aria-hidden="true">
  <div class="sheet-in">
    <div class="sheet-head">
      <h2 id="set-title"><img src="st/laptop.webp" alt="" loading="lazy">設定</h2>
      <button class="done" id="close-set">完成</button>
    </div>
    <div class="grp" id="grp-rate">日幣匯率（日幣 ÷ 匯率 = 台幣）</div>
    <div class="row">
      <label for="rate">現在匯率 <small>算你的成本</small>
        <div class="field"><input id="rate" type="number" inputmode="decimal" step="0.01" value="4.9"></div>
      </label>
      <label for="markup">給客人匯率 <small>報價用這個算</small>
        <div class="field"><input id="markup" type="number" inputmode="decimal" step="0.01" value="4.7"></div>
      </label>
    </div>
    <p class="hint">每種幣別的匯率分開記住，切換上方幣別就會換。可查 <a href="https://rate.bot.com.tw/xrt" target="_blank" rel="noopener">台灣銀行牌告</a>。</p>
    <div class="grp">費用（所有幣別共用）</div>
    <div class="row">
      <label for="fee">代購費 <small>按商品金額</small>
        <div class="field"><input id="fee" type="number" inputmode="decimal" step="0.5" value="5"><span>%</span></div>
      </label>
      <label for="ship">國際運費 <small>每件，台幣</small>
        <div class="field"><span>$</span><input id="ship" type="number" inputmode="numeric" value="60"></div>
      </label>
    </div>
    <div class="row">
      <label for="flat">固定手續費 <small>每單，台幣</small>
        <div class="field"><span>$</span><input id="flat" type="number" inputmode="numeric" value="0"></div>
      </label>
      <div class="lab">報價取整 <small id="round-hint">無條件進位</small>
        <div class="seg" role="group" aria-label="報價取整">
          <button data-round="1" aria-pressed="false">1 元</button>
          <button data-round="5" aria-pressed="false">5 元</button>
          <button data-round="10" aria-pressed="true">10 元</button>
        </div>
        <label class="check" for="nearest"><input type="checkbox" id="nearest"><span>四捨五入</span></label>
      </div>
    </div>
  </div>
</section>
<div class="toast" id="toast">已複製報價</div>

<script>
const ST={"wave":"st/wave.webp","heart":"st/heart.webp","shy":"st/shy.webp","box":"st/box.webp","search":"st/search.webp","think":"st/think.webp","laptop":"st/laptop.webp","cheer":"st/cheer.webp","letter":"st/letter.webp"};
const $=id=>document.getElementById(id);
const CUR={
  jpy:{sym:"¥",name:"日幣",rate:4.9,quote:4.7},
  krw:{sym:"₩",name:"韓幣",rate:40,quote:39},
  eur:{sym:"€",name:"歐元",rate:36,quote:37,mul:true}
};
let state={cur:"krw",round:10,rates:{jpy:4.9,krw:40,eur:36},quotes:{jpy:4.7,krw:39,eur:37},
  prices:{jpy:"3,980",krw:"39,000",eur:"120"},fee:5,ship:60,flat:0,qty:1};
try{const s=JSON.parse(localStorage.getItem("daigou-v2")||"null");if(s)state={...state,...s,rates:{...state.rates,...s.rates},quotes:{...state.quotes,...s.quotes},prices:{...state.prices,...s.prices}}}catch(e){}
if(state.rates.jpy<1){state.rates.jpy=4.9;state.quotes.jpy=4.7}
for(const k of ["jpy","krw","eur"]){if(!(+state.rates[k]>0))state.rates[k]=CUR[k].rate;if(!(+state.quotes[k]>0))state.quotes[k]=CUR[k].quote}
const save=()=>{try{localStorage.setItem("daigou-v2",JSON.stringify(state))}catch(e){}};

const num=v=>{const n=parseFloat(String(v).replace(/[^\d.]/g,""));return isFinite(n)?n:0};
const nt=n=>Math.round(n).toLocaleString("zh-TW");
const fx=n=>n.toLocaleString("zh-TW",{maximumFractionDigits:2});
const roundUp=(n,s)=>state.nearest?Math.round(n/s)*s:Math.ceil(n/s-1e-9)*s;

function quoteFor(price,qty){
  const rate=num($("rate").value),qr=num($("markup").value),fee=num($("fee").value)/100;
  const ship=num($("ship").value),flat=num($("flat").value);
  const mul=CUR[state.cur].mul, sub=price*qty, per=mul?rate:(rate>0?1/rate:0), qper=mul?qr:(qr>0?1/qr:0);
  const goods=sub*qper, feeAmt=goods*fee, extra=ship*qty+flat;
  const total=roundUp(goods+feeAmt+extra,state.round);
  const cost=sub*per+ship*qty;
  return {raw:sub*per,feeAmt,extra,total,cost,profit:total-cost};
}

let curFace="wave";
Object.values(ST).forEach(u=>{const i=new Image();i.src=u});
function face(k,msg){$("say").textContent=msg;if(k===curFace)return;curFace=k;const m=$("mascot");m.classList.add("swap");setTimeout(()=>{m.src=ST[k];m.classList.remove("swap")},120)}

const MOODS=[
  {min:100000,st:"cheer",say:["財神來了！韓吉要準備數錢了！"]},
  {min:80000,st:"cheer",say:["韓吉：這筆可以開香檳嗎？🍠"]},
  {min:50000,st:"wave",say:["財神路過，韓吉趕快揮手招呼！"]},
  {min:30000,st:"cheer",say:["今天的業績有點厲害喔！"]},
  {min:20000,st:"box",say:["大單出現！韓吉開始認真打包了"]},
  {min:12000,st:"search",say:["這筆很可以，韓吉眼睛亮起來了✨"]},
  {min:8000,st:"wave",say:["今天走路好像都比較有風～"]},
  {min:5000,st:"heart",say:["不錯喔，晚餐可以加一道菜了！"]},
  {min:2000,st:"heart",say:["今天可以多喝一杯飲料了🫶🏻"]},
  {min:-1,st:"wave",say:["小小進帳，韓吉替你開心！"]}
];
let moodTier=-1,moodLine="";
function mood(total){const i=MOODS.findIndex(m=>total>m.min);
  if(i!==moodTier){moodTier=i;const L=MOODS[i].say;moodLine=L[Math.floor(Math.random()*L.length)]}
  face(MOODS[i].st,moodLine)}
function render(){
  const c=CUR[state.cur],price=num($("price").value),qty=Math.max(1,Math.round(num($("qty").value)||1));
  const r=quoteFor(price,qty);
  const t=$("total");t.innerHTML="<small>NT$</small>"+nt(r.total);
  t.classList.remove("pop");void t.offsetWidth;t.classList.add("pop");setTimeout(()=>t.classList.remove("pop"),150);
  $("b-raw").textContent="$"+nt(r.raw);
  $("b-fee").textContent="$"+nt(r.feeAmt);
  $("b-ship").textContent="$"+nt(r.extra);
  $("b-cost").textContent="$"+nt(r.cost);
  $("b-profit").textContent=(r.profit>=0?"+$":"−$")+nt(Math.abs(r.profit));
  $("quote").textContent=`商品 ${c.sym}${fx(price)} × ${qty} 件　報價 NT$${nt(r.total)}`;
  const op=c.mul?"×":"÷";$("c-rate").textContent="匯率 "+op+num($("rate").value);
  $("c-quote").textContent="給客人 "+op+num($("markup").value);
  $("c-fee").textContent="代購費 "+num($("fee").value)+"%";
  $("c-ship").textContent="運費 $"+num($("ship").value);
  $("grp-rate").textContent=`${c.name}匯率（${c.name} ${op} 匯率 = 台幣）`;
  $("round-hint").textContent=state.nearest?"四捨五入":"無條件進位";$("res-st").src=r.profit<0?ST.think:ST.heart;
  if(!price) {moodTier=-1;face("search","先輸入商品價格喔～")}
  else if(!num($("rate").value)||!num($("markup").value)) face("think","匯率還沒填，按右上角設定～");
  else if(r.profit<0) {moodTier=-1;face("shy","這單會虧錢，調一下設定吧！")}
  else mood(r.total);
  state.prices[state.cur]=$("price").value;state.rates[state.cur]=num($("rate").value);state.quotes[state.cur]=num($("markup").value);
  state.fee=num($("fee").value);state.ship=num($("ship").value);state.flat=num($("flat").value);state.qty=qty;
  save();
}

function setCur(k){
  state.cur=k;
  for(const x of ["jpy","krw","eur"])$("tab-"+x).setAttribute("aria-pressed",k===x);
  $("sym").textContent=CUR[k].sym;$("price").value=state.prices[k];
  $("rate").value=state.rates[k];$("rate").step=k==="jpy"?"0.01":"0.1";
  $("markup").value=state.quotes[k];$("markup").step=k==="jpy"?"0.01":"0.1";
  render();
}

function openSet(o){$("sheet").classList.toggle("open",o);$("scrim").classList.toggle("open",o);$("sheet").setAttribute("aria-hidden",!o);
  if(o)setTimeout(()=>$("close-set").focus(),50);else $("open-set").focus()}
$("open-set").onclick=()=>openSet(true);$("summary").onclick=()=>openSet(true);
$("close-set").onclick=()=>openSet(false);$("scrim").onclick=()=>openSet(false);
document.addEventListener("keydown",e=>{if(e.key==="Escape")openSet(false)});

for(const x of ["jpy","krw","eur"])$("tab-"+x).onclick=()=>setCur(x);
["price","qty","rate","markup","fee","ship","flat"].forEach(id=>$(id).addEventListener("input",render));
let prevPrice="";
$("price").addEventListener("focus",()=>{prevPrice=$("price").value;$("price").value=""});
$("price").addEventListener("blur",()=>{if($("price").value.trim()===""){$("price").value=prevPrice;return}const n=num($("price").value);$("price").value=n?fx(n):"";render()});
$("minus").onclick=()=>{$("qty").value=Math.max(1,(+$("qty").value||1)-1);render()};
$("plus").onclick=()=>{$("qty").value=(+$("qty").value||0)+1;render()};
document.querySelectorAll("[data-round]").forEach(b=>b.onclick=()=>{state.round=+b.dataset.round;
  document.querySelectorAll("[data-round]").forEach(x=>x.setAttribute("aria-pressed",x===b));render()});
$("copy").onclick=()=>{const txt=$("quote").textContent;const ok=()=>{face("letter","報價複製好了，快貼給客人吧！");const t=$("toast");t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1600)};
  try{navigator.clipboard.writeText(txt).then(ok,selectQ)}catch(e){selectQ()}};
function selectQ(){const r=document.createRange();r.selectNodeContents($("quote"));const s=getSelection();s.removeAllRanges();s.addRange(r);$("toast").textContent="已選取，長按複製";$("toast").classList.add("show");setTimeout(()=>{$("toast").classList.remove("show");$("toast").textContent="已複製報價"},1800)}

$("fee").value=state.fee;$("ship").value=state.ship;$("flat").value=state.flat;$("qty").value=state.qty;
document.querySelectorAll("[data-round]").forEach(x=>x.setAttribute("aria-pressed",+x.dataset.round===state.round));
$("nearest").checked=!!state.nearest;
$("nearest").onchange=()=>{state.nearest=$("nearest").checked;render()};
setCur(state.cur);
</script>

</body>
</html>
