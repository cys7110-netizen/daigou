<!doctype html>
<html lang="zh-Hant">
<head>
<title>韓吉代購換算</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='10' y='4' width='44' height='56' rx='10' fill='%23c94f6b' stroke='%234a2228' stroke-width='4'/%3E%3Crect x='17' y='11' width='30' height='13' rx='4' fill='%23fff0ee' stroke='%234a2228' stroke-width='3'/%3E%3Cg fill='%23fff0ee' stroke='%234a2228' stroke-width='2.5'%3E%3Crect x='17' y='30' width='8' height='8' rx='2'/%3E%3Crect x='28' y='30' width='8' height='8' rx='2'/%3E%3Crect x='39' y='30' width='8' height='8' rx='2'/%3E%3Crect x='17' y='42' width='8' height='8' rx='2'/%3E%3Crect x='28' y='42' width='8' height='8' rx='2'/%3E%3Crect x='39' y='42' width='8' height='8' rx='2' fill='%23ffd9df'/%3E%3C/g%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="韓吉代購">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
/* Layout: one chunky sticker-card calculator, mascot reacts on top, quick-price table below */
:root{
  --bg:#fff6f4; --dots:#f6dcdc;
  --card:#ffffff; --ink:#4a2228; --muted:#8c5c63;
  --potato:#c94f6b; --potato-hi:#e0788f; --cheek:#ff8a95;
  --sun:#ffc93c; --sky:#5aa9e6; --field:#fff0ee;
  --display:"Fredoka","M PLUS Rounded 1c","Noto Sans TC","PingFang TC",system-ui,sans-serif;
  --body:"M PLUS Rounded 1c","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#2a1a1e; --dots:#3a252b; --card:#3a2329; --ink:#ffe9ec; --muted:#d7a9b1;
  --potato:#d9607b; --potato-hi:#f08ba1; --cheek:#ff9aa5; --sun:#ffd25e; --sky:#7cbcf0; --field:#4a2d34; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#2a1a1e; --dots:#3a252b; --card:#3a2329; --ink:#ffe9ec; --muted:#d7a9b1;
  --potato:#d9607b; --potato-hi:#f08ba1; --cheek:#ff9aa5; --sun:#ffd25e; --sky:#7cbcf0; --field:#4a2d34; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);background-image:radial-gradient(var(--dots) 2px,transparent 2.5px);background-size:22px 22px;color:var(--ink);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

header{display:flex;align-items:center;gap:12px}
.mascot{width:112px;height:112px;object-fit:contain;flex:none;animation:bob 2.6s ease-in-out infinite;transition:transform .2s}
.mascot.swap{transform:scale(.85)}
.deco{width:58px;height:58px;object-fit:contain;flex:none}
.sec-h{display:flex;align-items:center;gap:8px}
.result-st{position:absolute;right:6px;top:4px;width:86px;height:86px;object-fit:contain;transform:rotate(8deg)}
@keyframes bob{50%{transform:translateY(-4px) rotate(-2deg)}}
.bubble{position:relative;background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:10px 16px;margin-left:6px;box-shadow:3px 3px 0 var(--ink);flex:1;min-width:0}
.bubble::before,.bubble::after{content:"";position:absolute;top:50%;width:0;height:0;border-style:solid;border-color:transparent}
.bubble::before{left:-17px;margin-top:-10px;border-width:10px 14px 10px 0;border-right-color:var(--ink)}
.bubble::after{left:-11px;margin-top:-7px;border-width:7px 10px 7px 0;border-right-color:var(--card)}
.bubble h1{margin:0;font-family:var(--display);font-weight:700;font-size:1.45rem;text-wrap:balance;letter-spacing:.02em}
.bubble p{margin:2px 0 0;color:var(--muted);font-size:.86rem}

.card{background:var(--card);border:3px solid var(--ink);border-radius:24px;box-shadow:5px 5px 0 var(--ink);padding:18px;display:flex;flex-direction:column;gap:14px}

.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--field);border:3px solid var(--ink);border-radius:999px;padding:4px}
.tabs button{font:700 1rem var(--body);color:var(--ink);background:transparent;border:0;border-radius:999px;padding:9px 6px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.tabs button[aria-pressed="true"]{background:var(--potato);color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.tabs .flag{font-family:var(--display);font-size:.8rem;background:var(--card);color:var(--ink);border-radius:999px;padding:1px 7px;border:2px solid var(--ink)}

label{display:flex;flex-direction:column;gap:5px;font-weight:700;font-size:.85rem;min-width:0}
label small{font-weight:500;color:var(--muted);font-size:.75rem}
.field{display:flex;align-items:center;background:var(--field);border:3px solid var(--ink);border-radius:16px;padding:0 12px;min-width:0}
.field:focus-within{box-shadow:0 0 0 3px var(--sun)}
.field span{font-family:var(--display);font-weight:600;color:var(--muted);white-space:nowrap}
.field input{flex:1;min-width:0;width:100%;border:0;background:transparent;color:var(--ink);font:600 1.1rem var(--display);padding:10px 6px;outline:none;font-variant-numeric:tabular-nums}
.big .field input{font-size:1.9rem;padding:8px 6px}
.big .field span{font-size:1.4rem}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:.75rem;color:var(--muted);margin:-4px 0 0;line-height:1.5}
.hint a{color:var(--potato);font-weight:700}

details{border-top:3px dashed var(--dots);padding-top:10px}
summary{cursor:pointer;font-weight:800;font-size:.9rem;list-style:none;display:flex;align-items:center;gap:6px}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸";transition:transform .2s}
details[open] summary::before{transform:rotate(90deg)}
.adv{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{font:700 .82rem var(--body);color:var(--ink);background:var(--field);border:2.5px solid var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--sun);color:#4a2228}

.result{position:relative;background:var(--potato);color:#fff;border:3px solid var(--ink);border-radius:24px;box-shadow:5px 5px 0 var(--ink);padding:18px;overflow:hidden}
.result .lbl{font-weight:800;font-size:.85rem;opacity:.92;letter-spacing:.05em}
.result .price{font-family:var(--display);font-weight:700;font-size:clamp(2.4rem,11vw,3.2rem);line-height:1.1;font-variant-numeric:tabular-nums;margin:2px 0 10px;transition:transform .15s}
.result .price{padding-right:80px}
.result .price.pop{transform:scale(1.06)}
.result .price small{font-size:.45em;margin-right:4px;opacity:.9}
.break{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:.88rem;background:rgba(0,0,0,.14);border-radius:14px;padding:10px 12px;font-variant-numeric:tabular-nums}
.break b{font-family:var(--display);font-weight:600;text-align:right}
.break .profit{color:#ffe3e8;font-weight:700}
.spark{position:absolute;color:var(--sun);font-size:1.4rem;right:16px;top:10px;animation:tw 1.8s ease-in-out infinite}
.spark.s2{right:46px;top:26px;font-size:.9rem;animation-delay:.6s}
@keyframes tw{50%{transform:scale(.6) rotate(20deg);opacity:.6}}
.copy{margin-top:12px;width:100%;font:800 1rem var(--body);color:#4a2228;background:#ffd9df;border:3px solid var(--ink);border-radius:999px;padding:11px;cursor:pointer;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.copy:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.quote{margin-top:10px;font-size:.8rem;background:rgba(255,255,255,.16);border-radius:12px;padding:8px 10px;white-space:pre-wrap;word-break:break-word;user-select:all}

h2{font-family:var(--display);font-weight:700;font-size:1.1rem;margin:0;display:flex;align-items:center;gap:8px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:.75rem;color:var(--muted);text-align:left;font-weight:700;padding:0 4px 6px;letter-spacing:.04em}
th:last-child,td:last-child{text-align:right}
td{padding:8px 4px;border-top:2px dashed var(--dots);font-family:var(--display);font-weight:600}
td:last-child{color:var(--potato)}
tr.tap{cursor:pointer}
tr.tap:hover td{background:var(--field)}
.foot{text-align:center;font-size:.75rem;color:var(--muted)}

button:focus-visible,summary:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,120px);background:var(--ink);color:var(--card);font-weight:700;padding:10px 18px;border-radius:999px;transition:transform .25s;z-index:5}
.toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <img class="mascot" id="mascot" alt="" src="">
    <div class="bubble">
      <h1>韓吉代購換算</h1>
      <p id="say">輸入日幣或韓幣，馬上幫你算台幣報價！</p>
    </div>
  </header>

  <section class="card" aria-label="換算設定">
    <div class="tabs" role="group" aria-label="選擇幣別">
      <button id="tab-jpy" aria-pressed="true"><span class="flag">JP</span>日幣 ¥</button>
      <button id="tab-krw" aria-pressed="false"><span class="flag">KR</span>韓幣 ₩</button>
    </div>

    <div class="big">
      <label for="price">商品價格
        <div class="field"><span id="sym">¥</span><input id="price" type="text" inputmode="decimal" value="3,980" autocomplete="off"></div>
      </label>
    </div>

    <div class="row">
      <label for="qty">數量
        <div class="field"><input id="qty" type="number" inputmode="numeric" min="1" value="1"><span>件</span></div>
      </label>
      <label for="rate">匯率 <small id="rate-hint">1 日幣可換多少台幣</small>
        <div class="field"><input id="rate" type="number" inputmode="decimal" step="0.0001" value="0.2050"></div>
      </label>
    </div>
    <p class="hint">預設匯率只是參考，請改成你今天實際刷卡或換匯的匯率（可查 <a href="https://rate.bot.com.tw/xrt" target="_blank" rel="noopener">台灣銀行牌告</a>）。日韓匯率會分開記住。</p>

    <details id="more" open>
      <summary>代購費用設定 <img class="deco" data-st="laptop" alt="" src="" style="width:44px;height:44px;margin-left:auto"></summary>
      <div class="adv">
        <div class="row">
          <label for="markup">匯率加價 <small>報價匯率 = 匯率 + 這個</small>
            <div class="field"><span>+</span><input id="markup" type="number" inputmode="decimal" step="0.001" value="0.010"></div>
          </label>
          <label for="fee">代購費 <small>按商品金額</small>
            <div class="field"><input id="fee" type="number" inputmode="decimal" step="0.5" value="5"><span>%</span></div>
          </label>
        </div>
        <div class="row">
          <label for="ship">國際運費 <small>每件，台幣</small>
            <div class="field"><span>$</span><input id="ship" type="number" inputmode="numeric" value="60"></div>
          </label>
          <label for="flat">固定手續費 <small>每單，台幣</small>
            <div class="field"><span>$</span><input id="flat" type="number" inputmode="numeric" value="0"></div>
          </label>
        </div>
        <label>報價取整
          <div class="seg" role="group" aria-label="報價取整">
            <button data-round="1" aria-pressed="false">到 1 元</button>
            <button data-round="5" aria-pressed="false">到 5 元</button>
            <button data-round="10" aria-pressed="true">到 10 元</button>
          </div>
        </label>
      </div>
    </details>
  </section>

  <section class="result" aria-live="polite">
    <img class="result-st" id="res-st" alt="" src="">
    <div class="lbl">給客人的報價</div>
    <div class="price" id="total"><small>NT$</small>0</div>
    <div class="break">
      <span>商品原價換算</span><b id="b-raw">—</b>
      <span>報價匯率</span><b id="b-rate">—</b>
      <span>代購費</span><b id="b-fee">—</b>
      <span>運費＋手續費</span><b id="b-ship">—</b>
      <span>你的實際成本</span><b id="b-cost">—</b>
      <span>預估利潤</span><b class="profit" id="b-profit">—</b>
    </div>
    <button class="copy" id="copy">複製報價給客人</button>
    <div class="quote" id="quote"></div>
  </section>

  <section class="card" aria-label="快速對照表">
    <h2><img class="deco" data-st="box" alt="" src="">常見價位對照 <small style="font-size:.75rem;color:var(--muted);font-weight:600">點一下帶入</small></h2>
    <table>
      <thead><tr><th id="q-h">日幣</th><th>原價換算</th><th>報價（1 件）</th></tr></thead>
      <tbody id="q-body"></tbody>
    </table>
  </section>

  <p class="foot"><img class="deco" data-st="letter" alt="" src="" style="display:block;margin:0 auto 4px">設定只存在你這台裝置上</p>
</div>
<div class="toast" id="toast">已複製報價</div>

const $=id=>document.getElementById(id);
const CUR={
  jpy:{sym:"¥",name:"日幣",rate:0.2050,steps:[500,1000,2000,3000,5000,8000,10000,20000]},
  krw:{sym:"₩",name:"韓幣",rate:0.0222,steps:[5000,10000,20000,30000,50000,80000,100000,200000]}
};
let state={cur:"jpy",round:10,rates:{jpy:CUR.jpy.rate,krw:CUR.krw.rate},markups:{jpy:0.010,krw:0.0010},
  prices:{jpy:"3,980",krw:"39,000"},fee:5,ship:60,flat:0,qty:1};
try{const s=JSON.parse(localStorage.getItem("daigou-v1")||"null");if(s)state={...state,...s,rates:{...state.rates,...s.rates},markups:{...state.markups,...s.markups},prices:{...state.prices,...s.prices}}}catch(e){}
const save=()=>{try{localStorage.setItem("daigou-v1",JSON.stringify(state))}catch(e){}};

const num=v=>{const n=parseFloat(String(v).replace(/[^\d.]/g,""));return isFinite(n)?n:0};
const nt=n=>Math.round(n).toLocaleString("zh-TW");
const fx=n=>n.toLocaleString("zh-TW",{maximumFractionDigits:0});
const roundUp=(n,s)=>Math.ceil(n/s-1e-9)*s;

function quoteFor(price,qty){
  const rate=num($("rate").value),mk=num($("markup").value),fee=num($("fee").value)/100;
  const ship=num($("ship").value),flat=num($("flat").value);
  const qrate=rate+mk, sub=price*qty;
  const goods=sub*qrate, feeAmt=goods*fee, extra=ship*qty+flat;
  const total=roundUp(goods+feeAmt+extra,state.round);
  const cost=sub*rate+ship*qty;
  return {rate,qrate,raw:sub*rate,feeAmt,extra,total,cost,profit:total-cost};
}

let curFace="";
function face(k,msg){$("say").textContent=msg;if(k===curFace)return;curFace=k;const m=$("mascot");m.classList.add("swap");setTimeout(()=>{m.src=ST[k];m.classList.remove("swap")},120)}
document.querySelectorAll("[data-st]").forEach(i=>i.src=ST[i.dataset.st]);

function render(){
  const c=CUR[state.cur],price=num($("price").value),qty=Math.max(1,Math.round(num($("qty").value)||1));
  const r=quoteFor(price,qty);
  const t=$("total");t.innerHTML="<small>NT$</small>"+nt(r.total);
  t.classList.remove("pop");void t.offsetWidth;t.classList.add("pop");setTimeout(()=>t.classList.remove("pop"),150);
  $("b-raw").textContent="$"+nt(r.raw);
  $("b-rate").textContent=r.qrate.toFixed(4);
  $("b-fee").textContent="$"+nt(r.feeAmt);
  $("b-ship").textContent="$"+nt(r.extra);
  $("b-cost").textContent="$"+nt(r.cost);
  $("b-profit").textContent=(r.profit>=0?"+$":"−$")+nt(Math.abs(r.profit));
  $("quote").textContent=`商品 ${c.sym}${fx(price)} × ${qty} 件\n報價 NT$${nt(r.total)}（含代購費、國際運費）`;
  if(!price) face("search","先輸入商品價格喔～");
  else if(r.profit<0) face("shy","這樣報價會虧錢，調一下費用吧！");
  else if(r.total>=10000) face("cheer",`大單！NT$${nt(r.total)} 要確認客人預算～`);
  else face("wave",`${c.name} ${c.sym}${fx(price)} 報價 NT$${nt(r.total)}！`);
  $("q-h").textContent=c.name;$("rate-hint").textContent=`1 ${c.name}可換多少台幣`;$("res-st").src=r.profit<0?ST.think:ST.heart;
  $("q-body").innerHTML=c.steps.map(p=>{const q=quoteFor(p,1);return `<tr class="tap" data-p="${p}" tabindex="0"><td>${c.sym}${fx(p)}</td><td>$${nt(q.raw)}</td><td>$${nt(q.total)}</td></tr>`}).join("");
  state.prices[state.cur]=$("price").value;state.rates[state.cur]=num($("rate").value);state.markups[state.cur]=num($("markup").value);
  state.fee=num($("fee").value);state.ship=num($("ship").value);state.flat=num($("flat").value);state.qty=qty;
  save();
}

function setCur(k){
  state.cur=k;
  $("tab-jpy").setAttribute("aria-pressed",k==="jpy");$("tab-krw").setAttribute("aria-pressed",k==="krw");
  $("sym").textContent=CUR[k].sym;$("price").value=state.prices[k];
  $("rate").value=state.rates[k].toFixed(4);$("rate").step=k==="jpy"?"0.0001":"0.00001";
  $("markup").value=state.markups[k];$("markup").step=k==="jpy"?"0.001":"0.0001";
  render();
}

$("tab-jpy").onclick=()=>setCur("jpy");$("tab-krw").onclick=()=>setCur("krw");
["price","qty","rate","markup","fee","ship","flat"].forEach(id=>$(id).addEventListener("input",render));
$("price").addEventListener("blur",()=>{const n=num($("price").value);$("price").value=n?fx(n):"";render()});
document.querySelectorAll("[data-round]").forEach(b=>b.onclick=()=>{state.round=+b.dataset.round;
  document.querySelectorAll("[data-round]").forEach(x=>x.setAttribute("aria-pressed",x===b));render()});
const pick=tr=>{$("price").value=fx(+tr.dataset.p);render();window.scrollTo({top:0,behavior:"smooth"})};
$("q-body").addEventListener("click",e=>{const tr=e.target.closest("tr");if(tr)pick(tr)});
$("q-body").addEventListener("keydown",e=>{const tr=e.target.closest("tr");if(tr&&(e.key==="Enter"||e.key===" ")){e.preventDefault();pick(tr)}});
$("copy").onclick=()=>{const txt=$("quote").textContent;const ok=()=>{face("letter","報價複製好了，快貼給客人吧！");const t=$("toast");t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1600)};
  try{navigator.clipboard.writeText(txt).then(ok,()=>{selectQ()})}catch(e){selectQ()}};
function selectQ(){const r=document.createRange();r.selectNodeContents($("quote"));const s=getSelection();s.removeAllRanges();s.addRange(r);$("toast").textContent="已選取，長按複製";$("toast").classList.add("show");setTimeout(()=>{$("toast").classList.remove("show");$("toast").textContent="已複製報價"},1800)}

$("fee").value=state.fee;$("ship").value=state.ship;$("flat").value=state.flat;$("qty").value=state.qty;
document.querySelectorAll("[data-round]").forEach(x=>x.setAttribute("aria-pressed",+x.dataset.round===state.round));
setCur(state.cur);
</script>

</body>
</html>
